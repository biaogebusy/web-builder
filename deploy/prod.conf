# 1Panel / OpenResty site reverse-proxy configuration for Xinshi.
# Paste these location blocks inside the server {} block managed by 1Panel.
# The proxy_cache_panel cache zone is created and managed by 1Panel.
# See deploy/nginx-global-1panel.conf for the recorded global configuration.

# Authentication and administration routes must retain cookies and must never
# use a shared proxy cache.
location ~* ^/(oauth|user|session|admin|manage|quickedit)(/|$) {
    proxy_pass http://127.0.0.1:8070;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 240s;

    # Keep Cookie and Set-Cookie intact for authenticated Drupal requests.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    add_header X-Request-ID $request_id always;
    add_header X-Response-Time $request_time always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# Public Drupal APIs and static Drupal resources. This preserves the current
# 1Panel behavior: requests are anonymous upstream and may use its shared cache.
location ~* ^/(editor|batch|views/ajax|entity_reference_autocomplete|taxonomy/([^/]+)/([^/]+)/edit|autocomplete|media-library|history|quickedit|webform_rest|contextual|themes|shs-term-data|modules|libraries|core|api|en/api|system|print|export|sites/([^/]+)/files|front-preview|dropzonejs|ckeditor_uploadimage/rest) {
    proxy_pass http://127.0.0.1:8070;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 240s;

    proxy_buffering on;
    proxy_cache proxy_cache_panel;
    proxy_cache_key "drupal:$host$uri$is_args$args";
    proxy_cache_methods GET HEAD;
    proxy_cache_min_uses 1;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_age 240s;
    proxy_cache_lock_timeout 240s;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_bypass $http_x_boost_fetch $arg_nocache $arg_preview $arg_no_cache $cookie_nocache;
    proxy_no_cache $arg_nocache $arg_preview $arg_no_cache $cookie_nocache;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_cache_valid 200 304 301 302 10m;

    add_header X-Request-ID $request_id always;
    add_header X-Proxy-Cache $upstream_cache_status always;
    add_header X-Response-Time $request_time always;
    add_header X-Upstream-Connect-Time $upstream_connect_time always;
    add_header X-Upstream-Header-Time $upstream_header_time always;
    add_header X-Upstream-Response-Time $upstream_response_time always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($uri ~* "\.(gif|png|jpg|jpeg|webp|avif|svg|css|js|woff|woff2)$") {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        sendfile on;
    }
}

# Angular routes that may contain authentication state or preview content.
# They retain cookies and always bypass the shared HTML cache.
location ~* ^/(?:en/)?(?:builder|preview|me|my)(?:/|$) {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;
    proxy_buffering off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $request_id always;
    add_header X-Response-Time $request_time always;
    add_header X-Upstream-Connect-Time $upstream_connect_time always;
    add_header X-Upstream-Header-Time $upstream_header_time always;
    add_header X-Upstream-Response-Time $upstream_response_time always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# Public Angular SSR pages. Only anonymous GET/HEAD requests without a query
# string enter the shared cache. Any Cookie, Authorization header, query string,
# WebSocket upgrade, Set-Cookie response, or private Cache-Control response
# bypasses caching.
location / {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Proxy caching requires buffering. Angular returns a complete SSR response,
    # so buffering also prevents a slow client from holding the Node connection.
    proxy_buffering on;
    proxy_cache proxy_cache_panel;
    proxy_cache_key "ssr:$scheme:$host:$uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_min_uses 1;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_age 15s;
    proxy_cache_lock_timeout 15s;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 5m;

    # A non-empty value makes Nginx bypass or avoid storing the response.
    proxy_cache_bypass $http_upgrade $http_authorization $http_cookie $is_args;
    proxy_no_cache $http_upgrade $http_authorization $http_cookie $is_args $upstream_http_set_cookie;

    # Node's public Cache-Control and X-Accel-Expires headers remain authoritative.
    # Do not ignore Cache-Control, Expires, Set-Cookie, or X-Accel-Expires here.

    # Request IDs must be unique per request, not copied from a cached response.
    proxy_hide_header X-Request-ID;
    proxy_hide_header Server-Timing;

    add_header X-Request-ID $request_id always;
    add_header X-Proxy-Cache $upstream_cache_status always;
    add_header X-Response-Time $request_time always;
    add_header X-Upstream-Connect-Time $upstream_connect_time always;
    add_header X-Upstream-Header-Time $upstream_header_time always;
    add_header X-Upstream-Response-Time $upstream_response_time always;
    add_header Server-Timing "proxy-cache;desc=\"$upstream_cache_status\"" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# 1Panel / OpenResty site reverse-proxy configuration for Xinshi.
# Paste these location blocks inside the server {} block managed by 1Panel.
# The proxy_cache_panel cache zone is created and managed by 1Panel.
# See deploy/nginx-global-1panel.conf for the recorded global configuration.

# Block webshell and scanner probe paths.
# These extensions (.jsp .php .cgi etc.) never exist in an Angular app.
# Return 444 (close connection, no response body) to avoid SSR rendering
# and upstream API calls from scan traffic.
location ~* \.(jsp|jspx|aspx?|php\d*|cgi|cfm|pl|py)$ {
    return 444;
}

# Block common webshell filename keywords.
location ~* (webshell|phpspy|aspxspy|jspspy|jspxspy|aspspy) {
    return 444;
}

# Block hidden files and sensitive dirs that never exist in this app.
# /.well-known/* is NOT blocked (used by Let's Encrypt ACME etc.).
location ~* /\.(env|git|svn|hg|htaccess|htpasswd|DS_Store|aws) {
    return 444;
}

# Block CMS admin scan paths not used by this site (WordPress / phpMyAdmin).
location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma) {
    return 444;
}


# Login and token endpoints — strict rate limit to stop brute force.
# Must come before the general auth location or it would match first.
# rate=5r/m + burst=10 allows legit retries, blocks sustained attacks.
location ~* ^/(oauth/(token|authorize)|user/(login|register|password)) {
    limit_req zone=auth_login burst=10 nodelay;
    limit_req_status 429;
    limit_conn perip 10;

    proxy_pass http://127.0.0.1:8070;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 240s;

    proxy_no_cache 1;
    proxy_cache_bypass 1;

    add_header X-Request-ID $request_id always;
    add_header X-Response-Time $request_time always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

# Authentication and administration routes must retain cookies and must never
# use a shared proxy cache.
location ~* ^/(oauth|user|session|admin|manage|quickedit)(/|$) {
    limit_conn perip 50;

    proxy_pass http://127.0.0.1:8070;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 240s;

    # Keep Cookie and Set-Cookie intact for authenticated Drupal requests.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    add_header X-Request-ID $request_id always;
    add_header X-Response-Time $request_time always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

# Static Drupal assets (css/js/images/fonts) — long cache, no cookie, no access log.
# Must come before the general Drupal API location to match first.
# Previously an `if` block set expiry, but add_header inside `if` replaces
# the location's add_header directives, dropping security headers from
# static responses. Split into a dedicated location to fix that.
location ~* ^/(themes|modules|libraries|core|sites)/.*\.(gif|png|jpg|jpeg|webp|avif|svg|css|js|woff|woff2)$ {
    limit_conn perip 50;

    proxy_pass http://127.0.0.1:8070;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 240s;

    proxy_buffering on;
    proxy_cache proxy_cache_panel;
    proxy_cache_key "drupal:$host$uri$is_args$args";
    proxy_cache_methods GET HEAD;
    proxy_cache_min_uses 1;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_age 240s;
    proxy_cache_lock_timeout 240s;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_bypass $http_x_boost_fetch $arg_nocache $arg_preview $arg_no_cache $cookie_nocache;
    proxy_no_cache $arg_nocache $arg_preview $arg_no_cache $cookie_nocache;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_cache_valid 200 301 302 365d;

    expires 365d;
    access_log off;
    sendfile on;

    add_header X-Request-ID $request_id always;
    add_header X-Proxy-Cache $upstream_cache_status always;
    add_header X-Response-Time $request_time always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Public Drupal APIs and static Drupal resources. This preserves the current
# 1Panel behavior: requests are anonymous upstream and may use its shared cache.
location ~* ^/(editor|batch|views/ajax|entity_reference_autocomplete|taxonomy/([^/]+)/([^/]+)/edit|autocomplete|media-library|history|quickedit|webform_rest|contextual|themes|shs-term-data|modules|libraries|core|api|zh-hant/api|zh-hans/api|en/api|system|print|export(?=/|$)|sites/([^/]+)/files|front-preview|dropzonejs|ckeditor_uploadimage/rest) {
    limit_conn perip 50;

    proxy_pass http://127.0.0.1:8070;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 240s;

    proxy_buffering on;
    proxy_cache proxy_cache_panel;
    proxy_cache_key "drupal:$host$uri$is_args$args";
    proxy_cache_methods GET HEAD;
    proxy_cache_min_uses 1;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_age 240s;
    proxy_cache_lock_timeout 240s;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_bypass $http_x_boost_fetch $arg_nocache $arg_preview $arg_no_cache $cookie_nocache;
    proxy_no_cache $arg_nocache $arg_preview $arg_no_cache $cookie_nocache;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_cache_valid 200 304 301 302 10m;

    add_header X-Request-ID $request_id always;
    add_header X-Proxy-Cache $upstream_cache_status always;
    add_header X-Response-Time $request_time always;
    add_header X-Upstream-Connect-Time $upstream_connect_time always;
    add_header X-Upstream-Header-Time $upstream_header_time always;
    add_header X-Upstream-Response-Time $upstream_response_time always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

# Angular routes that may contain authentication state or preview content.
# They retain cookies and always bypass the shared HTML cache.
# The leading group matches an optional BCP 47 language prefix (en / zh-hans /
# zh-hant / ja / ko …) so new languages don't need edits here.
# The regex contains "{" quantifiers, so it MUST be quoted — otherwise nginx
# treats "{" as the start of the location block, truncating the regex and
# causing pcre_compile() to fail with "missing )".
location ~* "^/(?:[a-z]{2}(?:-[a-z]{2,4})?/)?(?:builder|preview|me|my)(?:/|$)" {
    limit_conn perip 30;

    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;
    # Builder routes serve AI streaming replies (pro branch). Keep buffering
    # off or nginx buffers the stream until complete, breaking live output.
    proxy_buffering off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $request_id always;
    add_header X-Response-Time $request_time always;
    add_header X-Upstream-Connect-Time $upstream_connect_time always;
    add_header X-Upstream-Header-Time $upstream_header_time always;
    add_header X-Upstream-Response-Time $upstream_response_time always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

# Angular static assets — identical for all users, so never bypass on
# cookie/auth/query. Matches /assets/ and /media/ paths, or common static
# extensions at root (main.js / styles.css / fonts / icons).
# Must sit after the builder/preview location and before location /:
# /builder/foo.js still goes to builder, /index.html still goes to SSR.
location ~* ^/(assets|media)/|\.(js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
    limit_conn perip 50;

    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    proxy_buffering on;
    proxy_cache proxy_cache_panel;
    proxy_cache_key "static:$scheme:$host:$uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_min_uses 1;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_age 15s;
    proxy_cache_lock_timeout 15s;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 301 302 365d;
    proxy_cache_valid 404 1m;

    # Static assets are user-agnostic. Only bypass on WebSocket upgrade or query string.
    proxy_cache_bypass $http_upgrade $is_args;
    proxy_no_cache $http_upgrade $is_args;

    expires 365d;
    access_log off;
    sendfile on;

    add_header X-Request-ID $request_id always;
    add_header X-Proxy-Cache $upstream_cache_status always;
    add_header X-Response-Time $request_time always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Public Angular SSR pages. Only anonymous GET/HEAD requests without a query
# string enter the shared cache. Any Cookie, Authorization header, query string,
# WebSocket upgrade, Set-Cookie response, or private Cache-Control response
# bypasses caching.
location / {
    limit_conn perip 50;
    limit_conn perserver 1000;

    # Only allow standard HTTP methods; block TRACE/TRACK/CONNECT etc.
    # GET implicitly includes HEAD, so HEAD is not listed separately.
    limit_except GET POST PUT DELETE PATCH OPTIONS {
        deny all;
    }

    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Proxy caching requires buffering. Angular returns a complete SSR response,
    # so buffering also prevents a slow client from holding the Node connection.
    proxy_buffering on;
    proxy_cache proxy_cache_panel;
    proxy_cache_key "ssr:$scheme:$host:$uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_min_uses 1;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_age 15s;
    proxy_cache_lock_timeout 15s;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 5m;
    # 301/302 cached 10m (language/path redirects are stable); 404 cached 1m to absorb scan traffic.
    proxy_cache_valid 301 302 10m;
    proxy_cache_valid 404 1m;

    # A non-empty value makes Nginx bypass or avoid storing the response.
    proxy_cache_bypass $http_upgrade $http_authorization $http_cookie $is_args;
    proxy_no_cache $http_upgrade $http_authorization $http_cookie $is_args $upstream_http_set_cookie;

    # Node's public Cache-Control and X-Accel-Expires headers remain authoritative.
    # Do not ignore Cache-Control, Expires, Set-Cookie, or X-Accel-Expires here.

    # Request IDs must be unique per request, not copied from a cached response.
    proxy_hide_header X-Request-ID;
    proxy_hide_header Server-Timing;

    add_header X-Request-ID $request_id always;
    add_header X-Proxy-Cache $upstream_cache_status always;
    add_header X-Response-Time $request_time always;
    add_header X-Upstream-Connect-Time $upstream_connect_time always;
    add_header X-Upstream-Header-Time $upstream_header_time always;
    add_header X-Upstream-Response-Time $upstream_response_time always;
    add_header Server-Timing "proxy-cache;desc=\"$upstream_cache_status\"" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

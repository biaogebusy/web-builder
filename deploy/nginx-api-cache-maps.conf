# Load once in the http {} context, before the site configuration in prod.conf.
# API caches require an anonymous read and an explicit public shared lifetime.
map $request_method $api_cache_unsafe_method {
    default 1;
    GET "";
    HEAD "";
}

map "$api_cache_unsafe_method$http_authorization$http_cookie$http_upgrade$http_cache_control$http_pragma$http_x_boost_fetch$arg_nocache$arg_preview$arg_no_cache" $api_cache_bypass {
    default 1;
    "" 0;
}

map $upstream_http_cache_control $api_cache_public {
    default 0;
    "~*(^|,)\s*public\s*(,|$)" 1;
}

map $upstream_http_cache_control $api_cache_shared_ttl {
    default 0;
    "~*(^|,)\s*s-maxage\s*=\s*[1-9][0-9]*\s*(,|$)" 1;
}

map $upstream_http_cache_control $api_cache_forbidden {
    default 0;
    "~*(^|,)\s*(private|no-store|no-cache)\s*(=|,|$)" 1;
}

map $upstream_http_x_accel_expires $api_cache_accel_denied {
    default 0;
    "~^0+$" 1;
}

map "$api_cache_public:$api_cache_shared_ttl:$api_cache_forbidden:$api_cache_accel_denied:$upstream_http_set_cookie" $api_cache_response_rejected {
    default 1;
    "1:1:0:0:" 0;
}

# Use the upstream status only for cache writes. Cache hits have no upstream status.
map $upstream_status $api_cache_bad_status {
    default 1;
    200 0;
}

# Evaluate the final status for browser headers, including responses served from cache.
map "$api_cache_bypass:$api_cache_response_rejected:$status" $api_response_cache_control {
    default "private, no-store";
    "0:0:200" $upstream_http_cache_control;
}

# Reference snapshot of the global 1Panel / OpenResty Nginx configuration.
# This is not a site server {} configuration. Site-specific location blocks
# are recorded separately in deploy/nginx.conf.

user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
error_log /dev/stdout notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    server_tokens off;
    access_log /var/log/nginx/access.log main;
    access_log /dev/stdout main;
    sendfile on;
    server_names_hash_bucket_size 512;
    client_header_buffer_size 32k;
    client_max_body_size 50m;
    keepalive_timeout 180;
    keepalive_requests 100000;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_disable "MSIE [1-6]\.";

    # Brotli compression (better ratio than gzip, supported by modern browsers).
    # Verify the brotli module is compiled in before enabling:
    #   nginx -V 2>&1 | grep -i brotli
    # If the output contains ngx_brotli / brotli, uncomment the four lines
    # below. If not, install the module or leave these commented. Enabling
    # an uncompiled directive breaks `nginx -t` and stops the service.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 100;
    # brotli_types text/plain text/css text/xml application/json
    #               application/javascript application/xml+rss
    #               application/atom+xml image/svg+xml;

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;

    # Rate limit zone for login/token endpoints. Referenced in prod.conf via
    # limit_req zone=auth_login ...
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;

    # Conditionally set the Connection header: send "upgrade" only when the
    # client sends an Upgrade header (WebSocket), otherwise "close".
    # Referenced in prod.conf via proxy_set_header Connection $connection_upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
    include /usr/local/openresty/1pwaf/data/conf/waf.conf;

    proxy_temp_path /www/common/proxy/proxy_temp_dir;
    proxy_cache_path /www/common/proxy/proxy_cache_dir levels=1:2 keys_zone=proxy_cache_panel:20m inactive=1d max_size=5g;
    client_body_buffer_size 512k;
    proxy_connect_timeout 180s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffer_size 32k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;
    proxy_next_upstream error timeout invalid_header http_500 http_503 http_404;
    proxy_cache proxy_cache_panel;
}

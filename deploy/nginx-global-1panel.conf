# Reference snapshot of the global 1Panel / OpenResty Nginx configuration.
# This is not a site server {} configuration. Site-specific location blocks
# are recorded separately in deploy/nginx.conf.

user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
error_log /dev/stdout notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    server_tokens off;
    access_log /var/log/nginx/access.log main;
    access_log /dev/stdout main;
    sendfile on;
    server_names_hash_bucket_size 512;
    client_header_buffer_size 32k;
    client_max_body_size 50m;
    keepalive_timeout 180;
    keepalive_requests 100000;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_disable "MSIE [1-6]\.";

    # Brotli 压缩 (比 gzip 压缩率更高,现代浏览器均支持)。
    # 启用前先确认 OpenResty 编译了 brotli 模块:
    #   nginx -V 2>&1 | grep -i brotli
    # 若输出含 ngx_brotli / brotli,取消下面四行注释即可;若未编译,
    # 安装 ngx_brotli 模块或保持注释状态。直接启用未编译的指令会导致
    # nginx -t 失败、服务无法启动,务必先验证。
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 100;
    # brotli_types text/plain text/css text/xml application/json
    #               application/javascript application/xml+rss
    #               application/atom+xml image/svg+xml;

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;

    # 登录/令牌端点限流,防御暴力破解。在 prod.conf 的 login location 中通过
    # limit_req zone=auth_login ... 引用。
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;

    # 让 Connection 头根据是否带 Upgrade 条件化:仅 WebSocket 请求发 "upgrade",
    # 普通请求发 "close"。在 prod.conf 中通过 proxy_set_header Connection
    # $connection_upgrade 引用。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
    include /usr/local/openresty/1pwaf/data/conf/waf.conf;

    proxy_temp_path /www/common/proxy/proxy_temp_dir;
    proxy_cache_path /www/common/proxy/proxy_cache_dir levels=1:2 keys_zone=proxy_cache_panel:20m inactive=1d max_size=5g;
    client_body_buffer_size 512k;
    proxy_connect_timeout 180s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffer_size 32k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;
    proxy_next_upstream error timeout invalid_header http_500 http_503 http_404;
    proxy_cache proxy_cache_panel;
}

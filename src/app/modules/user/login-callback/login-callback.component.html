<div class="callback-page">
  <div class="bg-grid" aria-hidden="true"></div>

  <div class="callback-card">
    @if (error(); as errorValue) {
      <div class="state" role="alert">
        <div class="icon-tile is-error" aria-hidden="true">
          <mat-icon>error_outline</mat-icon>
        </div>
        <h1 class="title">{{ 'CALLBACK.TITLE_ERROR' | translate }}</h1>
        <div class="panel">
          <p class="panel-text">{{ errorValue }}</p>
        </div>
        <div class="actions">
          <button mat-flat-button class="pill-btn" (click)="retry()">
            {{ 'CALLBACK.RETRY' | translate }}
          </button>
          <button mat-stroked-button class="pill-btn" (click)="goLogin()">
            {{ 'CALLBACK.BACK_TO_LOGIN' | translate }}
          </button>
        </div>
      </div>
    } @else {
      <div class="state" role="status" aria-live="polite">
        <div class="icon-tile" aria-hidden="true">
          <mat-icon>lock</mat-icon>
        </div>
        <h1 class="title">{{ 'CALLBACK.TITLE_LOADING' | translate }}</h1>
        <p class="subtitle">{{ 'CALLBACK.MESSAGE_LOADING' | translate }}</p>
        <div class="progress" aria-hidden="true"></div>
      </div>
    }
  </div>
</div>

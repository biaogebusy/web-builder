@for (contentValue of [content()]; track contentValue.fields) {
  <div class="inline-editor">
    @if (contentValue.fields) {
      <app-formly
        [fields]="contentValue.fields"
        [model]="model"
        [form]="form"
        [options]="options"
        (modelChange)="onModelChange($event)"
      />
    }
    <div class="actions m-top-sm">
      <app-btn
        (click)="onClear()"
        [content]="{
          label: 'BUILDER.INLINE_EDITOR.CLEAR_STYLES' | translate,
          color: 'warn',
          icon: { svg: 'format-clear' },
        }"
      />
    </div>
  </div>
}

<div class="builder-workspace">
  <app-builder-toolbar class="toolbar-host" [class]="builder.themeMode() + '-theme'" />
  <mat-drawer-container class="builder-main">
    <mat-drawer
      #drawer
      class="sidebar"
      [class]="builder.themeMode() + '-theme'"
      mode="side"
      [opened]="builderFullScreen() === false"
    >
      <router-outlet />
      <app-builder-version />
    </mat-drawer>
    <mat-drawer-content class="preview-content">
      @if (builder.currentShowcase(); as showcase) {
        <app-builder-showcase [content]="showcase" />
      }
      <app-builder-list />
    </mat-drawer-content>
  </mat-drawer-container>
</div>

<div class="page-setting-wrapper">
  <div class="page-setting">
    @if (loading() || publicationLoading()) {
      <div class="load">
        <app-loading />
      </div>
    }
    <app-formly [form]="form" [fields]="fields" [model]="model" />
    @if (publicationFailed()) {
      <p role="status">{{ 'BUILDER.PAGE_SETTING.STATE_LOAD_FAILED' | translate }}</p>
      <app-btn
        (click)="refreshPublication()"
        [content]="{ label: 'BUILDER.PAGE_SETTING.STATE_RETRY' | translate }"
      />
    }
    @if (updateFailed()) {
      <p role="status">{{ 'BUILDER.PAGE_SETTING.UPDATE_FAIL' | translate }}</p>
    }
    <div class="actions">
      <app-btn
        (click)="onUpdate(model)"
        [content]="{
          label: 'BUILDER.PAGE_SETTING.UPDATE' | translate,
          color: 'primary',
          mode: 'raised',
          disabled: loading() || updating() || publicationLoading() || form.invalid,
        }"
      />
      @if (type === 'node--json') {
        <app-btn
          (click)="onJson()"
          [content]="{
            label: 'BUILDER.PAGE_SETTING.EDIT_JSON' | translate,
            color: 'primary',
            mode: 'stroked',
          }"
        />
      }
      @if (type === 'node--landing_page') {
        <app-btn
          (click)="onPreview()"
          [content]="{
            label: 'BUILDER.PAGE_SETTING.PREVIEW' | translate,
            color: 'primary',
            mode: 'stroked',
          }"
        />
      }
      <app-btn
        (click)="deletePage(model)"
        [content]="{
          label:
            (isTranslation
              ? 'BUILDER.PAGE_SETTING.DELETE_TRANSLATION'
              : 'BUILDER.PAGE_SETTING.DELETE'
            ) | translate,
          color: 'warn',
        }"
      />
    </div>
  </div>
</div>

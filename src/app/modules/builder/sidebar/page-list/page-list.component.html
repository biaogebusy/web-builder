<div class="page-list">
  <div class="reload">
    @if (!loading()) {
      <app-btn
        [matTooltip]="'BUILDER.PAGE_LIST.RESET' | translate"
        matTooltipPosition="above"
        (click)="onReload()"
        [content]="{
          label: '',
          mode: 'icon',
          color: undefined,
          icon: { svg: 'reload' },
        }"
      />
    }
  </div>
  <app-title
    [content]="{
      label: 'BUILDER.PAGE_LIST.MANAGE_LIST' | translate,
      style: 'none',
      classes: 'p-y-xs !mb-0 bold text-lg',
    }"
  />
  <div class="form">
    <app-formly
      [fields]="fields"
      [form]="form"
      [model]="model"
      (modelChange)="onModelChange($event)"
    />
  </div>
  <div class="lists-wrapper">
    <div class="lists">
      @if (loading()) {
        <div class="loading-wrapper">
          <app-loading [content]="{ size: 50 }" />
        </div>
      }
      @if (lists(); as content) {
        @for (page of content; track page) {
          <app-page-item [page]="page" (refresh)="onReload()" (pageLoad)="onPageLoaded()" />
        }
      }
    </div>
  </div>
  @if (pager(); as pager) {
    <div class="pager">
      <mat-paginator
        (page)="onPageChange($event)"
        [length]="pager.totalItems"
        [pageSize]="pager.itemsPerPage"
        [showFirstLastButtons]="true"
        [hidePageSize]="true"
        [pageIndex]="pager.currentPage"
        aria-label="Select page"
      />
    </div>
  }
</div>

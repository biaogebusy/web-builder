<div class="builder-page">
  <mat-accordion multi>
    <mat-expansion-panel [expanded]="true">
      <mat-expansion-panel-header>
        <mat-panel-title>
          <h2 class="panel-title">{{ name() }}</h2>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <div class="lists">
        @if (loading()) {
          <div class="loading-wrapper">
            <app-loading [content]="{ size: 50 }" />
          </div>
        }
        @for (item of pages(); track item.uuid) {
          <app-page-item [page]="item" (refresh)="onReload()" />
        }
      </div>
      @if (links(); as links) {
        <div class="pager">
          <app-pagination-links [links]="links" (pageChange)="onPageChange($event)" />
        </div>
      }
      <mat-action-row>
        <app-btn
          (click)="onReload()"
          [content]="{
            label: 'BUILDER.PAGE_LIST.REFRESH' | translate,
            color: 'primary',
            icon: { svg: 'reload', inline: true },
          }"
        />
        <app-btn
          [content]="{
            label: 'BUILDER.PAGE_LIST.BACK_TO_LIST' | translate,
            color: 'primary',
            href: '/builder/page-list',
            icon: { svg: 'web', inline: true },
          }"
        />
      </mat-action-row>
    </mat-expansion-panel>
  </mat-accordion>
</div>

<div class="builder-page">
  <mat-accordion multi>
    <mat-expansion-panel [expanded]="true">
      <mat-expansion-panel-header>
        <mat-panel-title>{{ name() }}</mat-panel-title>
      </mat-expansion-panel-header>
      <div class="lists">
        @if (loading()) {
          <div class="loading-wrapper">
            <app-loading [content]="{ size: 24 }" />
          </div>
        }
        @for (item of pages(); track item.uuid) {
          <app-page-item [page]="item" (refresh)="onReload()" />
        }
      </div>
    </mat-expansion-panel>
  </mat-accordion>
</div>

@let rightContent = builder.rightContent$ | async;
<div class="builder-wrapper">
  <button
    type="button"
    mat-icon-button
    class="mobile-sidebar-toggle"
    [class.opened]="sidebarDrawerOpened()"
    [attr.aria-label]="
      (sidebarDrawerOpened() ? 'BUILDER.SIDEBAR.COLLAPSE' : 'BUILDER.SIDEBAR.EXPAND') | translate
    "
    [attr.aria-expanded]="sidebarDrawerOpened()"
    aria-controls="builder-sidebar-drawer"
    (click)="sidebarDrawerOpened.set(!sidebarDrawerOpened())"
  >
    <app-icon [content]="{ svg: sidebarDrawerOpened() ? 'chevron-left' : 'menu' }" />
  </button>
  <mat-drawer-container class="builder-drawer-container" [hasBackdrop]="isMobile()">
    <mat-drawer
      #drawer
      id="builder-sidebar-drawer"
      class="sidebar-drawer"
      [(opened)]="sidebarDrawerOpened"
      [mode]="isMobile() ? 'over' : 'side'"
      [autoFocus]="isMobile()"
      [class]="sidebarDrawerOpened() ? 'opened' : 'closed'"
    >
      <app-builder-sidebar
        [sidebarDrawer]="drawer"
        (toggleSidebar)="sidebarDrawerOpened.set(!sidebarDrawerOpened())"
      />
    </mat-drawer>
    <mat-drawer-content class="drawer-content" [class.opened]="sidebarDrawerOpened()">
      <div
        class="builder"
        [class]="{ 'has-sidebar': builderFullScreen() === false }"
      >
        <mat-drawer-container
          [hasBackdrop]="rightContent?.hasBackdrop"
          class="mat-drawer-transition"
        >
          <mat-drawer
            class="right-drawer"
            [class]="rightContent?.classes"
            #builderRightDrawer
            [style]="{
              overflow: builderRightDrawer.opened ? 'visible' : 'auto',
            }"
            [mode]="rightContent?.mode || 'over'"
            position="end"
          >
            <div class="right-header">
              @if (rightContent?.title) {
                <h2 class="right-title">{{ rightContent?.title }}</h2>
              }
              <app-btn
                [matTooltip]="'BUILDER.ROOT.COLLAPSE' | translate"
                (click)="onClose()"
                [content]="{
                  label: '',
                  mode: 'icon',
                  icon: { svg: 'page-last' },
                }"
              />
            </div>
            @if (builderRightDrawer.opened) {
              @if (rightContent) {
                <div class="right-content" [style]="rightContent.style">
                  @for (item of rightContent.elements; track item) {
                    <app-dynamic-component [inputs]="item" />
                  }
                </div>
              }
            }
          </mat-drawer>
          <mat-drawer-content>
            <router-outlet />
          </mat-drawer-content>
        </mat-drawer-container>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>

<div class="wrapper">
  <div class="actions">
    <div
      class="item item-up"
      [class.!block]="index() > 0"
      [matTooltip]="'上移'"
      matTooltipPosition="above"
    >
      <app-btn
        (btnClick)="onUpdown('up')"
        [content]="{
          label: '',
          color: 'primary',
          mode: 'icon',
          icon: { svg: 'arrow-collapse-up', inline: true },
        }"
      />
    </div>
    <div
      class="item item-down"
      [class.!block]="index() < length() && index() !== length() - 1"
      [matTooltip]="'下移'"
      matTooltipPosition="above"
    >
      <app-btn
        (btnClick)="onUpdown('down')"
        [content]="{
          label: '',
          color: 'primary',
          mode: 'icon',
          icon: { svg: 'arrow-collapse-down', inline: true },
        }"
      />
    </div>
    <div class="item" matTooltip="复制JSON" matTooltipPosition="above">
      <app-btn
        (btnClick)="onCopy()"
        [content]="{
          label: '',
          color: 'primary',
          mode: 'icon',
          icon: { svg: 'content-copy', inline: true },
        }"
      />
    </div>
    @if (bcData(); as bcDataValue) {
      <div
        class="item"
        matTooltip="粘贴复制的组件到下面"
        matTooltipPosition="above"
      >
        <app-btn
          (btnClick)="onPaste(bcDataValue)"
          [content]="{
            label: '',
            color: 'primary',
            mode: 'icon',
            icon: { svg: 'content-paste', inline: true },
          }"
        />
      </div>
    }
    @if (canUpload()) {
      <div
        class="item"
        [matTooltip]="'BUILDER.NODE_UIUX.UPLOAD' | translate"
        matTooltipPosition="above"
      >
        <app-btn
          (btnClick)="onUpload()"
          [content]="{
            color: 'primary',
            mode: 'icon',
            icon: { svg: 'cloud-upload-outline', inline: true },
            ariaLabel: 'BUILDER.NODE_UIUX.UPLOAD' | translate,
            disabled: uploading(),
          }"
        />
      </div>
    }
    @if (type() === 'custom-template') {
      <div
        class="item"
        [matTooltip]="'编辑自定义模板'"
        matTooltipPosition="above"
      >
        <app-btn
          (btnClick)="onEditorCode()"
          [content]="{
            label: '',
            color: 'primary',
            mode: 'icon',
            icon: { svg: 'xml', inline: true },
          }"
        />
      </div>
    }
    <div
      class="item"
      [matTooltip]="'编辑组件通用配置'"
      matTooltipPosition="above"
    >
      <app-btn
        (btnClick)="onSetting()"
        [content]="{
          label: '',
          color: 'primary',
          mode: 'icon',
          icon: { svg: 'tune-vertical', inline: true },
        }"
      />
    </div>

    <app-divider [content]="{ vertical: true }" />
    <div class="item" [matTooltip]="'移除'" matTooltipPosition="above">
      <app-btn
        (btnClick)="onDelete()"
        [content]="{
          label: '',
          color: 'primary',
          mode: 'icon',
          icon: { svg: 'delete', inline: true },
        }"
      />
    </div>
  </div>
</div>

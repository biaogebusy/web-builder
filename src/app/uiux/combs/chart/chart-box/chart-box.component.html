@if (data(); as data) {
  <div class="chart-box">
    <div class="chart-info">
      <!-- 插值会让 Angular 持有文本节点,内联编辑清空宿主后绑定失联;改 innerHTML 绑定 -->
      <div
        class="title mat-h3 one-line"
        [attr.data-path]="'label'"
        contentedit="label"
        contenteditProfile="inline"
        [innerHTML]="data.label"
      ></div>
      <div class="count one-line">
        {{ data.total }}
      </div>
    </div>
    @if (showChart()) {
      @defer (hydrate on viewport) {
        <app-chart class="chart-area" [content]="data.chart" [style]="style()" />
      } @placeholder {
        <div class="chart-area chart-skeleton" [style]="style()"></div>
      }
    }
  </div>
}

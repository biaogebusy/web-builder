@if (editor(); as editor) {
  <div
    class="bubble-row"
    role="toolbar"
    tabindex="-1"
    [attr.aria-label]="'BUILDER.TIPTAP.TOOLBAR' | translate"
    (keydown)="onToolbarKeydown($event)"
  >
    <app-btn
      (click)="editor.chain().focus().toggleBold().run()"
      [content]="{
        mode: 'icon',
        ariaLabel: 'BUILDER.TIPTAP.BOLD' | translate,
        color: editor.isActive('bold') ? 'primary' : undefined,
        icon: { svg: 'format-bold' },
      }"
    />
    <app-btn
      (click)="editor.chain().focus().toggleItalic().run()"
      [content]="{
        mode: 'icon',
        ariaLabel: 'BUILDER.TIPTAP.ITALIC' | translate,
        color: editor.isActive('italic') ? 'primary' : undefined,
        icon: { svg: 'format-italic' },
      }"
    />
    <app-btn
      (click)="editor.chain().focus().toggleUnderline().run()"
      [content]="{
        mode: 'icon',
        ariaLabel: 'BUILDER.TIPTAP.UNDERLINE' | translate,
        color: editor.isActive('underline') ? 'primary' : undefined,
        icon: { svg: 'format-underline' },
      }"
    />
    <app-btn
      (click)="editor.chain().focus().toggleStrike().run()"
      [content]="{
        mode: 'icon',
        ariaLabel: 'BUILDER.TIPTAP.STRIKE' | translate,
        color: editor.isActive('strike') ? 'primary' : undefined,
        icon: { svg: 'format-strikethrough' },
      }"
    />
    <app-btn
      (click)="editor.chain().focus().toggleHighlight().run()"
      [content]="{
        mode: 'icon',
        ariaLabel: 'BUILDER.TIPTAP.HIGHLIGHT' | translate,
        color: editor.isActive('highlight') ? 'primary' : undefined,
        icon: { svg: 'format-color-highlight' },
      }"
    />
    <app-btn
      (click)="editor.chain().focus().toggleCode().run()"
      [content]="{
        mode: 'icon',
        ariaLabel: 'BUILDER.TIPTAP.CODE' | translate,
        color: editor.isActive('code') ? 'primary' : undefined,
        icon: { svg: 'code-tags' },
      }"
    />
    <app-btn
      (click)="toggleStylePanel()"
      [content]="{
        mode: 'icon',
        ariaLabel: 'BUILDER.TIPTAP.TEXT_STYLE' | translate,
        color: stylePanelOpen() ? 'primary' : undefined,
        icon: { svg: 'format-color-text' },
      }"
    />
    @if (hasAlign(editor)) {
      <app-btn
        (click)="cycleAlign(editor)"
        [content]="{
          mode: 'icon',
          ariaLabel: 'BUILDER.TIPTAP.ALIGN' | translate,
          icon: { svg: alignIcon(editor) },
        }"
      />
    }
    <app-btn
      (click)="openLinkPanel()"
      [content]="{
        mode: 'icon',
        ariaLabel: 'BUILDER.TIPTAP.LINK' | translate,
        color: editor.isActive('link') ? 'primary' : undefined,
        icon: { svg: 'link-variant' },
      }"
    />
    <app-btn
      (click)="editor.chain().focus().unsetAllMarks().run()"
      [content]="{
        mode: 'icon',
        ariaLabel: 'BUILDER.TIPTAP.CLEAR_FORMAT' | translate,
        icon: { svg: 'format-clear' },
      }"
    />
  </div>
  @if (stylePanelOpen()) {
    <div class="style-panel" role="group" [attr.aria-label]="'BUILDER.TIPTAP.TEXT_STYLE' | translate">
      <label class="style-item">
        <span class="style-label">{{ 'BUILDER.TIPTAP.FONT_COLOR' | translate }}</span>
        <input
          #colorInput
          class="color-input"
          type="color"
          [value]="colorValue(editor, 'color', '#000000')"
          [attr.aria-label]="'BUILDER.TIPTAP.FONT_COLOR' | translate"
          (input)="applyColor(editor, colorInput.value)"
        />
      </label>
      <label class="style-item">
        <span class="style-label">{{ 'BUILDER.TIPTAP.BG_COLOR' | translate }}</span>
        <input
          #bgInput
          class="color-input"
          type="color"
          [value]="colorValue(editor, 'backgroundColor', '#ffffff')"
          [attr.aria-label]="'BUILDER.TIPTAP.BG_COLOR' | translate"
          (input)="applyBgColor(editor, bgInput.value)"
        />
      </label>
      <label class="style-item">
        <span class="style-label">{{ 'BUILDER.TIPTAP.FONT_SIZE' | translate }}</span>
        <select
          #sizeSelect
          class="size-select"
          [value]="fontSizeValue(editor)"
          [attr.aria-label]="'BUILDER.TIPTAP.FONT_SIZE' | translate"
          (change)="applyFontSize(editor, sizeSelect.value)"
        >
          <option value="">{{ 'BUILDER.TIPTAP.SIZE_DEFAULT' | translate }}</option>
          @for (size of fontSizes; track size) {
            <option [value]="size" [selected]="size === fontSizeValue(editor)">{{ size }}</option>
          }
        </select>
      </label>
    </div>
  }
  @if (linkPanelOpen()) {
    <div class="link-panel" role="group" [attr.aria-label]="'BUILDER.TIPTAP.LINK' | translate">
      <input
        #linkInput
        class="link-input"
        type="url"
        [value]="linkUrl()"
        [placeholder]="'BUILDER.TIPTAP.LINK_URL' | translate"
        [attr.aria-label]="'BUILDER.TIPTAP.LINK_URL' | translate"
        (keydown.enter)="applyLink(linkInput.value)"
        (keydown.escape)="closeLinkPanel()"
      />
      <app-btn
        (click)="applyLink(linkInput.value)"
        [content]="{
          label: 'BUILDER.TIPTAP.LINK_APPLY' | translate,
          color: 'primary',
        }"
      />
      @if (editor.isActive('link')) {
        <app-btn
          (click)="removeLink()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.LINK_REMOVE' | translate,
            icon: { svg: 'link-off' },
          }"
        />
      }
      <app-btn
        (click)="closeLinkPanel()"
        [content]="{
          mode: 'icon',
          ariaLabel: 'BUILDER.TIPTAP.CLOSE' | translate,
          icon: { svg: 'close' },
        }"
      />
    </div>
  }
}

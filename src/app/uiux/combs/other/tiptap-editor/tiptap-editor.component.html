<div class="editor-container">
  <!-- 气泡菜单:选中文本时浮现,行内格式 + 文字样式 + 链接(与画布内联编辑共用) -->
  <app-tiptap-bubble-menu #bubbleMenu [editor]="editor()" />
  <!-- 工具栏模板:toolbarContainer 指定外部容器时投影过去,否则就地渲染 -->
  <ng-template #toolbarTpl>
    @if (editor(); as editor) {
      <div
        class="toolbar"
        tabindex="-1"
        [attr.role]="toolbarDetached() ? null : 'toolbar'"
        [attr.aria-label]="toolbarDetached() ? null : ('BUILDER.TIPTAP.TOOLBAR' | translate)"
        (keydown)="onToolbarKeydown($event)"
      >
        <app-btn
          (click)="editor.chain().focus().undo().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.UNDO' | translate,
            disabled: !editor.can().chain().focus().undo().run(),
            icon: { svg: 'arrow-left-top' },
          }"
        />
        <app-btn
          (click)="editor.chain().focus().redo().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.REDO' | translate,
            disabled: !editor.can().chain().focus().redo().run(),
            icon: { svg: 'arrow-right-top' },
          }"
        />
        <mat-divider [vertical]="true" />
        <app-btn
          [mat-menu-trigger-for]="header"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.HEADING' | translate,
            color: editor.isActive('heading') ? 'primary' : undefined,
            icon: { svg: 'format-header-1' },
          }"
        />
        <mat-menu #header="matMenu">
          <button mat-menu-item (click)="editor.chain().focus().toggleHeading({ level: 1 }).run()">
            <span [class.text-primary]="editor.isActive('heading', { level: 1 })">
              {{ 'BUILDER.TIPTAP.H1' | translate }}
            </span>
          </button>
          <button mat-menu-item (click)="editor.chain().focus().toggleHeading({ level: 2 }).run()">
            <span [class.text-primary]="editor.isActive('heading', { level: 2 })">
              {{ 'BUILDER.TIPTAP.H2' | translate }}
            </span>
          </button>
          <button mat-menu-item (click)="editor.chain().focus().toggleHeading({ level: 3 }).run()">
            <span [class.text-primary]="editor.isActive('heading', { level: 3 })">
              {{ 'BUILDER.TIPTAP.H3' | translate }}
            </span>
          </button>
          <button mat-menu-item (click)="editor.chain().focus().toggleHeading({ level: 4 }).run()">
            <span [class.text-primary]="editor.isActive('heading', { level: 4 })">
              {{ 'BUILDER.TIPTAP.H4' | translate }}
            </span>
          </button>
          <button mat-menu-item (click)="editor.chain().focus().toggleHeading({ level: 5 }).run()">
            <span [class.text-primary]="editor.isActive('heading', { level: 5 })">
              {{ 'BUILDER.TIPTAP.H5' | translate }}
            </span>
          </button>
          <button mat-menu-item (click)="editor.chain().focus().toggleHeading({ level: 6 }).run()">
            <span [class.text-primary]="editor.isActive('heading', { level: 6 })">
              {{ 'BUILDER.TIPTAP.H6' | translate }}
            </span>
          </button>
        </mat-menu>
        <app-btn
          [mat-menu-trigger-for]="lists"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.LIST' | translate,
            color:
              editor.isActive('bulletList') || editor.isActive('orderedList')
                ? 'primary'
                : undefined,
            icon: { svg: 'format-list-bulleted' },
          }"
        />
        <mat-menu #lists="matMenu">
          <button mat-menu-item (click)="editor.chain().focus().toggleBulletList().run()">
            <div class="flex items-center" [class.text-primary]="editor.isActive('bulletList')">
              <app-icon [content]="{ svg: 'format-list-bulleted' }" />
              {{ 'BUILDER.TIPTAP.BULLET_LIST' | translate }}
            </div>
          </button>
          <button mat-menu-item (click)="editor.chain().focus().toggleOrderedList().run()">
            <div class="flex items-center" [class.text-primary]="editor.isActive('orderedList')">
              <app-icon [content]="{ svg: 'format-list-numbered' }" />
              {{ 'BUILDER.TIPTAP.ORDERED_LIST' | translate }}
            </div>
          </button>
        </mat-menu>
        <app-btn
          [mat-menu-trigger-for]="align"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.ALIGN' | translate,
            icon: { svg: alignIcon() },
          }"
        />
        <mat-menu #align="matMenu">
          <button mat-menu-item (click)="editor.chain().focus().setTextAlign('left').run()">
            <div
              class="flex items-center"
              [class.text-primary]="editor.isActive({ textAlign: 'left' })"
            >
              <app-icon [content]="{ svg: 'format-align-left' }" />
              {{ 'BUILDER.TIPTAP.ALIGN_LEFT' | translate }}
            </div>
          </button>
          <button mat-menu-item (click)="editor.chain().focus().setTextAlign('center').run()">
            <div
              class="flex items-center"
              [class.text-primary]="editor.isActive({ textAlign: 'center' })"
            >
              <app-icon [content]="{ svg: 'format-align-center' }" />
              {{ 'BUILDER.TIPTAP.ALIGN_CENTER' | translate }}
            </div>
          </button>
          <button mat-menu-item (click)="editor.chain().focus().setTextAlign('right').run()">
            <div
              class="flex items-center"
              [class.text-primary]="editor.isActive({ textAlign: 'right' })"
            >
              <app-icon [content]="{ svg: 'format-align-right' }" />
              {{ 'BUILDER.TIPTAP.ALIGN_RIGHT' | translate }}
            </div>
          </button>
          <button mat-menu-item (click)="editor.chain().focus().setTextAlign('justify').run()">
            <div
              class="flex items-center"
              [class.text-primary]="editor.isActive({ textAlign: 'justify' })"
            >
              <app-icon [content]="{ svg: 'format-align-justify' }" />
              {{ 'BUILDER.TIPTAP.ALIGN_JUSTIFY' | translate }}
            </div>
          </button>
        </mat-menu>
        <mat-divider [vertical]="true" />
        <app-btn
          (click)="editor.chain().focus().toggleBold().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.BOLD' | translate,
            color: editor.isActive('bold') ? 'primary' : undefined,
            icon: { svg: 'format-bold' },
          }"
        />
        <app-btn
          (click)="editor.chain().focus().toggleItalic().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.ITALIC' | translate,
            color: editor.isActive('italic') ? 'primary' : undefined,
            icon: { svg: 'format-italic' },
          }"
        />
        <app-btn
          (click)="editor.chain().focus().toggleUnderline().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.UNDERLINE' | translate,
            color: editor.isActive('underline') ? 'primary' : undefined,
            icon: { svg: 'format-underline' },
          }"
        />
        <app-btn
          (click)="editor.chain().focus().toggleStrike().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.STRIKE' | translate,
            color: editor.isActive('strike') ? 'primary' : undefined,
            icon: { svg: 'format-strikethrough' },
          }"
        />
        <app-btn
          (click)="editor.chain().focus().toggleHighlight().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.HIGHLIGHT' | translate,
            color: editor.isActive('highlight') ? 'primary' : undefined,
            icon: { svg: 'format-color-highlight' },
          }"
        />
        <mat-divider [vertical]="true" />
        <app-btn
          (click)="editor.chain().focus().toggleBlockquote().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.BLOCKQUOTE' | translate,
            color: editor.isActive('blockquote') ? 'primary' : undefined,
            icon: { svg: 'format-quote-open' },
          }"
        />
        <app-btn
          (click)="editor.chain().focus().toggleCodeBlock().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.CODE_BLOCK' | translate,
            color: editor.isActive('codeBlock') ? 'primary' : undefined,
            icon: { svg: 'xml' },
          }"
        />
        <app-btn
          (click)="editor.chain().focus().unsetAllMarks().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.CLEAR_FORMAT' | translate,
            icon: { svg: 'format-clear' },
          }"
        />
        <mat-divider [vertical]="true" />
        <app-btn
          (click)="editor.chain().focus().setParagraph().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.PARAGRAPH' | translate,
            color: editor.isActive('paragraph') ? 'primary' : undefined,
            icon: { svg: 'format-paragraph' },
          }"
        />
        <app-btn
          (click)="openLinkPanel()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.LINK' | translate,
            color: editor.isActive('link') ? 'primary' : undefined,
            icon: { svg: 'link-variant' },
          }"
        />
        <app-btn
          (click)="addImage()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.IMAGE' | translate,
            icon: { svg: 'image' },
          }"
        />
        <app-btn
          (click)="editor.chain().focus().setHorizontalRule().run()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.HR' | translate,
            icon: { svg: 'border-horizontal' },
          }"
        />
      </div>
    }
  </ng-template>
  @if (!toolbarDetached()) {
    <ng-container [ngTemplateOutlet]="toolbarTpl" />
  }

  <!-- 链接编辑面板:替代 window.prompt,可编辑/打开/移除,Enter 应用、Esc 关闭 -->
  @if (linkPanelOpen()) {
    <div class="link-panel" role="group" [attr.aria-label]="'BUILDER.TIPTAP.LINK' | translate">
      <input
        #linkInput
        class="link-input"
        type="url"
        [value]="linkUrl()"
        [placeholder]="'BUILDER.TIPTAP.LINK_URL' | translate"
        [attr.aria-label]="'BUILDER.TIPTAP.LINK_URL' | translate"
        (keydown.enter)="applyLink(linkInput.value)"
        (keydown.escape)="closeLinkPanel()"
      />
      <app-btn
        (click)="applyLink(linkInput.value)"
        [content]="{
          label: 'BUILDER.TIPTAP.LINK_APPLY' | translate,
          color: 'primary',
        }"
      />
      @if (editor()?.isActive('link')) {
        <app-btn
          (click)="openLink()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.LINK_OPEN' | translate,
            icon: { svg: 'open-in-new' },
          }"
        />
        <app-btn
          (click)="removeLink()"
          [content]="{
            mode: 'icon',
            ariaLabel: 'BUILDER.TIPTAP.LINK_REMOVE' | translate,
            icon: { svg: 'link-off' },
          }"
        />
      }
      <app-btn
        (click)="closeLinkPanel()"
        [content]="{
          mode: 'icon',
          ariaLabel: 'BUILDER.TIPTAP.CLOSE' | translate,
          icon: { svg: 'close' },
        }"
      />
    </div>
  }

  <!-- 编辑器区域 -->
  <div #tiptapEditor></div>
</div>

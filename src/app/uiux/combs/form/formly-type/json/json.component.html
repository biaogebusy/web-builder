<div class="json-field-wrapper">
  <div class="flex justify-end mb-2">
    @if (isShadcn) {
      <button type="button" class="shad-btn-outline" (click)="openInDialog()">放大编辑</button>
    } @else {
      <app-btn
        (click)="openInDialog()"
        [content]="{
          label: '放大编辑',
          color: 'primary',
          mode: 'stroked',
          classes: 'text-xs',
          icon: { svg: 'arrow-expand', inline: true },
        }"
      />
    }
  </div>
  <div #jsoneditor></div>
</div>

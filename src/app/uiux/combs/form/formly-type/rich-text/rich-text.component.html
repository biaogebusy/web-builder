<mat-form-field class="field-full" [appearance]="props.appearance || 'fill'">
  <textarea
    matInput
    [id]="id"
    [readonly]="props.readonly"
    [formControl]="formControl"
    [cols]="props.cols"
    [rows]="props.rows"
    [formlyAttributes]="field"
    [placeholder]="props.placeholder || ''"
    [tabindex]="props.tabindex"
    [cdkTextareaAutosize]="props.autosize"
    [cdkAutosizeMinRows]="props.autosizeMinRows"
    [cdkAutosizeMaxRows]="props.autosizeMaxRows"
    [class.cdk-textarea-autosize]="props.autosize"
  >
  </textarea>
  <app-btn
    matTooltip="富文本编辑"
    (click)="openRichText()"
    class="rich-text-btn"
    [content]="{
      icon: { svg: 'pencil' },
      mode: 'mini-fab',
      color: 'primary',
      disabled: props.readonly || formControl.disabled,
      ariaLabel: '富文本编辑',
    }"
  />
</mat-form-field>
<div class="popup" #popup>
  <ng-container #editorHost />
  @if (editorLoading()) {
    <app-loading class="editor-loading" [content]="{ size: 40 }" />
  } @else if (editorError()) {
    <div class="editor-error" role="alert">
      <span>{{ 'BUILDER.FORM_EDITOR.LOAD_FAILED' | translate }}</span>
      <app-btn
        (click)="retryEditor()"
        [content]="{
          label: 'BUILDER.FORM_EDITOR.RETRY' | translate,
          mode: 'stroked',
          ariaLabel: 'BUILDER.FORM_EDITOR.RETRY' | translate,
        }"
      />
    </div>
  }
  <div class="popup-actions">
    <app-btn (click)="onCancel()" [content]="{ label: '取消' }" />
    <app-btn
      (click)="onSave()"
      [content]="{
        label: '保存',
        mode: 'raised',
        color: 'primary',
        disabled: !editorLoaded() || formControl.disabled || props.readonly,
      }"
    />
  </div>
</div>

@if (content(); as contentValue) {
  <div class="comment-form m-bottom">
    <a class="anchor" id="comment" aria-hidden="true"></a>
    <app-title [content]="contentValue.editor?.title" />
    <div class="editor">
      @if (screenService.isPlatformBrowser()) {
        <div class="comment-editor-shell">
          <ng-container #editorHost />
          @if (!editorLoaded()) {
            @if (editorLoading()) {
              <div class="editor-loading" role="status"><app-loading /></div>
            } @else if (editorError()) {
              <button type="button" class="editor-placeholder" (click)="activateEditor()">
                {{ 'BUILDER.FORM_EDITOR.LOAD_FAILED' | translate }}
                {{ 'BUILDER.FORM_EDITOR.RETRY' | translate }}
              </button>
            } @else {
              <button type="button" class="editor-placeholder" (click)="activateEditor()">
                {{ contentValue.editor?.placeholder || placeholder }}
              </button>
            }
          }
        </div>
      }
    </div>
    <div class="actions p-y-sm p-x-sm">
      <button
        (click)="onSubmit(commentContent())"
        mat-raised-button
        color="primary"
        [disabled]="!commentContent()"
      >
        <div class="submit-inner">
          @if (loading) {
            <app-loading />
          }
          <span class="submit-label">{{ contentValue.editor?.action?.label || '提交' }}</span>
        </div>
      </button>
      <button class="cancel-btn" (click)="onCancel()" mat-button>取消</button>
    </div>
  </div>
}

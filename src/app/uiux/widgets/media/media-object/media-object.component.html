@if (content(); as contentValue) {
  <div class="media-object" [class.box-animate]="contentValue.css3">
    <div class="media-left">
      @if (contentValue.img) {
        @if (contentValue.img.src) {
          <app-img [attr.data-path]="'img'" [content]="contentValue.img" />
        }
      }
      @if (contentValue.icon) {
        <app-icon [content]="contentValue.icon" />
      }
      @if (contentValue.meta) {
        <div
          contentedit="meta"
          contenteditProfile="inline"
          class="meta"
          [innerHTML]="contentValue.meta | safeHtml"
        ></div>
      }
    </div>
    <div class="media-body">
      @if (contentValue.title) {
        <div
          contentedit="title"
          contenteditProfile="inline"
          class="title line-height-1 mat-h3"
          [innerHTML]="contentValue.title | safeHtml"
        ></div>
      }
      @if (contentValue.link) {
        <app-link [attr.data-path]="'link'" [content]="contentValue.link" />
      }
      @if (contentValue.subTitle) {
        <div
          contentedit="subTitle"
          contenteditProfile="inline"
          class="sub-title"
          [innerHTML]="contentValue.subTitle | safeHtml"
        ></div>
      }
      @if (contentValue.content) {
        <div
          contentedit="content"
          contenteditProfile="rich"
          class="media-content"
          [innerHTML]="contentValue.content | safeHtml"
        ></div>
      }
    </div>
  </div>
}

# Test setup and scope: xinshi-docs/stories/develop/engineering/testing.mdx.
# npm test covers Angular specs; npm run test:server covers src/server/**.
# Require this workflow in branch protection to block PRs when tests fail.
name: Unit tests

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NG_BUILD_MAX_WORKERS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v3.0.1

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"

      - name: NPM Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Server unit tests
        run: npm run test:server

      - name: Deployment regression
        run: node --test scripts/deploy-assets.test.mjs

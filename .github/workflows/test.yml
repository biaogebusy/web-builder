# 单元测试门禁：维护说明见 xinshi-docs/stories/develop/testing.mdx
# 覆盖范围:
#   npm test            → 前端 spec（排除 src/server/** 和 src/chat-server/**）
#   npm run test:server → src/server/** 和 src/chat-server/**（根 vitest.config.ts）
# 在 GitHub 分支保护规则中将本 workflow 设为 Required status check,
# 即可在红灯时阻断合并。
name: Unit tests

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3.0.1

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"

      - name: NPM Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Server unit tests
        run: npm run test:server

# Test setup and scope: xinshi-docs/stories/develop/engineering/testing.mdx.
# npm test covers Angular specs; npm run test:server covers src/server/**.
# Run both suites on demand through workflow_dispatch or npm run test:unit.
# Pushes and pull requests do not start this workflow.
name: Unit tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NG_BUILD_MAX_WORKERS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache Angular compilation
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-node22-angular-${{ hashFiles('package-lock.json', 'angular.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-angular-${{ hashFiles('package-lock.json', 'angular.json', 'tsconfig*.json') }}-

      - name: NPM Install
        run: bash scripts/ci-install.sh

      - name: Unit tests
        run: npm run test:unit

      - name: CI and deployment regressions
        run: node --test scripts/ci-install.test.mjs scripts/ci-changes.test.mjs scripts/deploy-assets.test.mjs

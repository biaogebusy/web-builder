name: Build app and deploy to ECS

on:
  push:
    branches: [master]

# Never interrupt or overlap uploads to the same deployment directory.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NG_BUILD_MAX_WORKERS: "2"
      DEPLOY_ROOT: /mnt/wwwroot/app/base
      DEPLOY_CONTAINER: base
    defaults:
      run:
        working-directory: ./
    steps:
      - name: work around permission issue
        run: git config --global --add safe.directory *

      - name: Checkout
        uses: actions/checkout@v3.0.1

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache verify
        run: npm cache verify

      - name: NPM Install
        run: npm ci

      # 单测门禁：维护说明见 xinshi-docs/stories/develop/testing.mdx
      # npm test 排除 src/server/** 和 src/chat-server/**，两者由 test:server 覆盖；
      # 任一红灯即中止构建与部署
      - name: Unit tests
        run: npm test

      - name: Server unit tests
        run: npm run test:server

      - name: Deployment regression
        run: node --test scripts/deploy-assets.test.mjs

      - name: NPM build all App Production
        run: npm run build

      # Publish assets first so new SSR output never references files still uploading.
      - name: Publish browser assets
        uses: AEnterprise/rsync-deploy@v1.0.2
        env:
          DEPLOY_KEY: ${{ secrets.KEY }}
          ARGS: -avz
          SERVER_PORT: "22"
          FOLDER: "dist/browser"
          SERVER_IP: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
          SERVER_DESTINATION: "${{ env.DEPLOY_ROOT }}/dist/"

      # FOLDER has no trailing slash: filter paths start with /dist/.
      # Retain hashed browser outputs, media and SSR imports for existing clients/processes.
      # Do not prune by mtime: even the active build can contain old files.
      - name: Deploy to Server
        uses: AEnterprise/rsync-deploy@v1.0.2
        env:
          DEPLOY_KEY: ${{ secrets.KEY }}
          ARGS: -avz --delete --exclude=node_modules --exclude=logs --filter=P_/dist/browser/*-????????.* --filter=P_/dist/browser/media/*-????????.* --filter=P_/dist/server/chunk-*.mjs
          SERVER_PORT: "22"
          FOLDER: "dist"
          SERVER_IP: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
          SERVER_DESTINATION: "${{ env.DEPLOY_ROOT }}"

      - name: Restart builder container
        uses: appleboy/ssh-action@v1.0.3
        with:
          envs: DEPLOY_ROOT,DEPLOY_CONTAINER
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            test -d "$DEPLOY_ROOT/dist/browser"
            test -s "$DEPLOY_ROOT/dist/server/server.mjs"
            docker restart "$DEPLOY_CONTAINER"

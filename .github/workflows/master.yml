name: Build app and deploy to ECS

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: work around permission issue
        run: git config --global --add safe.directory *

      - name: Checkout
        uses: actions/checkout@v3.0.1

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache verify
        run: npm cache verify

      - name: NPM Install
        run: npm ci over npm

      # 单测门禁：维护说明见 xinshi-docs/stories/develop/testing.mdx
      # npm test 排除 src/server/** 和 src/chat-server/**，两者由 test:server 覆盖；
      # 任一红灯即中止构建与部署
      - name: Unit tests
        run: npm test

      - name: Server unit tests
        run: npm run test:server

      - name: NPM build all App Production
        run: npm run build

      - name: Deploy to Server
        uses: AEnterprise/rsync-deploy@v1.0.2
        env:
          DEPLOY_KEY: ${{ secrets.KEY }}
          ARGS: -avz --delete --exclude=node_modules
          SERVER_PORT: "22"
          FOLDER: "dist"
          SERVER_IP: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
          SERVER_DESTINATION: "/mnt/wwwroot/app/base"

      - name: Restart builder container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.KEY }}
          port: 22
          script_stop: true
          script: docker restart base
